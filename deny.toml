# cargo-deny configuration — dependency security + license discipline.
# https://embarkstudios.github.io/cargo-deny/
#
# Run locally:  cargo deny --all-features check
# CI's `lint` job runs the EmbarkStudios/cargo-deny-action, which injects
# `--all-features` — so a bare `cargo deny check` (default features only) will
# MISS advisories in feature-gated trees (e.g. the `cortex` worker tooling).
# Always pass `--all-features` locally to match CI.
#
# Rationale: latexml-oxide ships a self-contained, redistributable binary
# (docs/release/RELEASE_CRITERIA.md §license audit), so every transitive dependency's
# license must be one we have vetted for that posture, and we want RUSTSEC
# advisories to fail the build rather than ship silently.

[advisories]
version = 2
# Fail on a yanked crate in the lockfile. Active vulnerabilities/unmaintained
# crates are denied by default under advisories schema v2.
yanked = "deny"
# Add `"RUSTSEC-YYYY-NNNN"` here (with a comment justifying it) only when an
# advisory is reviewed and accepted as not-applicable.
# (History: the `cortex`-only `pericortex` dep used to drag in tempdir/ansi_term
# (three advisories), fixed at the source in cortex-peripherals 60bec10 —
# tempdir→tempfile, ansi_term→inline ANSI — so those need no entry here.)
ignore = [
  # smartstring is UNMAINTAINED (repo archived 2026-05-03), not vulnerable — no
  # CVE, just no upstream maintenance. It is rhai's `ImmutableString` backing
  # type, a hard dep of rhai (still in 1.27.0, the newest release), so it cannot
  # be dropped without dropping rhai. rhai reaches the graph ONLY via the opt-in
  # `runtime-bindings` feature — which the distribution binary (latexml_oxide, built
  # by tools/make_release.sh) does enable, so the released binary ships smartstring;
  # only the production cortex_worker builds rhai-free. Reviewed 2026-08-12, 2026-11-18.
  "RUSTSEC-2026-0249",
  # chrono is UNMAINTAINED (RUSTSEC-2026-0543, chronotope/chrono#1768; "no safe upgrade"), not vulnerable — no CVE.
  # A direct dependency of latexml and latexml_engine (default-features off, `clock` + `std`): the local date/time for
  # \today, \time, \pdfcreationdate and the run identity (identity.rs, source_date.rs, tex_job.rs, pdftex.rs); also
  # reached through `pericortex` (the `cortex` feature, its logger's `chrono::Local`). The ignore stays for v0.8.0
  # (DG 2026-11-18); replacing it is SYNC_STATUS row R CHRONO, after the release. Reviewed 2026-11-17, 2026-11-18.
  "RUSTSEC-2026-0543",
]

[licenses]
version = 2
confidence-threshold = 0.9
# Permissive + public-domain set. A dependency whose license is NOT listed here
# fails the check, forcing an explicit review before it enters the distribution.
allow = [
  "CC0-1.0", # the workspace itself
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0", # weak (per-file) copyleft — safe to depend on for a CC0 binary
]

# libmarpa-asf-sys bundles libmarpa 8.6.2's C, statically linked: mostly MIT, but its obstack
# (marpa_obs.[ch], from GNU obstack; also the crate's modified c/marpa_obs.c) is LGPL-2.1-or-later
# and its AVL code (marpa_avl.[ch], marpa_tavl.[ch], from GNU libavl) LGPL-3.0-or-later. Linked
# since marpa 0.3.0; the crate's license field names them from 0.3.1. Allowed for this crate only
# (DG 2026-11-15) until marpa replaces those files with MIT code, which removes this exception.
[[licenses.exceptions]]
crate = "libmarpa-asf-sys"
allow = ["LGPL-2.1-or-later", "LGPL-3.0-or-later"]

[bans]
# Surface (but don't fail on) duplicate versions and wildcard version reqs.
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
# The marpa parser engine is sourced from github.com/dginev/marpa (see the
# root Cargo.toml note), so a git source is expected.
unknown-git = "allow"
