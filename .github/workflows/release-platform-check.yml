name: release platform check

# Runs tools/artifact_check.sh (no TeX: the embedded format, clean conversions,
# tools/release_smoke.sh) and tools/render_platform_check.sh on a PUBLISHED
# release's macOS and Windows binaries. The latter converts a generated split
# document with the automatic page-render fleet, serially (LATEXML_RENDER_JOBS=1),
# and again over the fleet run's own output. The fleet is otherwise exercised
# only by Linux runs and CI tests (SYNC_STATUS row R, RENDERPLATFORMS); run this
# on every release candidate before the final tag (docs/release/RELEASING.md).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to check (default: the newest published release, prereleases included)'
        required: false
  pull_request:
    paths:
      - '.github/workflows/release-platform-check.yml'
      - 'tools/render_platform_check.sh'

permissions:
  contents: read

jobs:
  check:
    name: render fleet (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15,       target: aarch64-apple-darwin,   ext: tar.gz, exe: latexml_oxide }
          - { runner: macos-15-intel, target: x86_64-apple-darwin,    ext: tar.gz, exe: latexml_oxide }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc, ext: zip,    exe: latexml_oxide.exe }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      TAG_INPUT: ${{ inputs.tag }}
    steps:
      - name: Resolve the release tag
        id: tag
        run: |
          tag="${TAG_INPUT:-$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 1 --json tagName -q '.[0].tagName')}"
          [ -n "$tag" ] || { echo "::error::no published release to check"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # The tree of the tag under test, so its scripts and tools/ar5iv-css.pin match its binary (a dispatch on an older
      # tag, or after a pin bump); a pull request checks out its own head, the scripts it changes.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name != 'pull_request' && steps.tag.outputs.tag || '' }}

      - name: Download and verify the release binary
        id: bin
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          tag="$TAG"
          asset="latexml-oxide-${tag}-${{ matrix.target }}.${{ matrix.ext }}"
          echo "release $tag, asset $asset"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --pattern "$asset.sha256" --dir dl
          cd dl
          if command -v sha256sum > /dev/null; then sha256sum -c "$asset.sha256"; else shasum -a 256 -c "$asset.sha256"; fi
          case "$asset" in
            *.zip) if command -v unzip > /dev/null; then unzip -q "$asset"; else 7z x -y "$asset" > /dev/null; fi ;;
            *) tar -xzf "$asset" ;;
          esac
          bin=$(find "$PWD" -name '${{ matrix.exe }}' -type f | head -1)
          [ -n "$bin" ] || { echo "::error::${{ matrix.exe }} not found in $asset"; exit 1; }
          chmod +x "$bin"
          "$bin" --version
          echo "path=$bin" >> "$GITHUB_OUTPUT"

      # The published binary, with no TeX, loads the format dump embedded in it and converts hello, an article and
      # expl3/ltcmd/hook code clean (tools/artifact_check.sh `notex`), then converts with resources/ moved aside, and
      # `--css=ar5iv.css --nodefaultresources` writes the bundled ar5iv.css beside the page (tools/release_smoke.sh,
      # which artifact_check.sh runs). Every release leg runs the same before publishing. The tag's own scripts: an
      # older tag has only release_smoke.sh, with or without its ar5iv checks, or neither, said as a notice.
      # Not on a pull request: that checks the newest published release with the pull request's scripts.
      - name: Artifact check, conversion smoke and the bundled ar5iv.css
        if: ${{ github.event_name != 'pull_request' }}
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          tag="$TAG"
          if [ -f tools/artifact_check.sh ]; then
            bash tools/artifact_check.sh "${{ steps.bin.outputs.path }}" notex; exit
          fi
          echo "::notice::$tag predates tools/artifact_check.sh (0.8.1): only tools/release_smoke.sh runs"
          if [ ! -f tools/release_smoke.sh ]; then
            echo "::notice::$tag predates tools/release_smoke.sh (0.8.0-rc2): the conversion smoke is skipped"; exit 0
          elif ! grep -q 'ar5iv' tools/release_smoke.sh; then
            echo "::notice::$tag predates the bundled ar5iv.css: its release_smoke.sh has no ar5iv checks (skipped)"
          fi
          bash tools/release_smoke.sh "${{ steps.bin.outputs.path }}" latexml_oxide/tests/hello/hello.tex

      - name: Split document, fleet vs serial
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if [ ! -f tools/render_platform_check.sh ]; then
            echo "::notice::$TAG predates tools/render_platform_check.sh (0.8.0-rc3): skipped"; exit 0
          fi
          bash tools/render_platform_check.sh "${{ steps.bin.outputs.path }}" "$RUNNER_TEMP/rpc"

      - name: Keep the logs and sites
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: render-platform-check-${{ matrix.target }}
          path: ${{ runner.temp }}/rpc
          retention-days: 7
