on:
  # `push` only on main, so a PR branch isn't checked twice (the
  # `pull_request` event already covers branch updates via `synchronize`).
  push:
    branches: [main]
  pull_request:

name: CI

# Cancel in-progress runs on the same branch when a new push arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Path gate. Emits two booleans the expensive jobs branch on, so that a PR
  # only pays for what its diff can actually affect. The `main`-push run
  # (trigger above) is the safety net: anything a PR skips is re-checked in
  # full at most one merge later, so a miss is recoverable, never silent.
  #
  #  * not_docs — false ONLY when every changed file is prose documentation
  #    (top-level `*.md`, all of `docs/**`, `.github/**/*.md`, LICENSE). It is
  #    computed as "`**` minus those", so ANY other path — a `.rs`, a `.tex`/
  #    `.xml` fixture, a `.rng`/`.xsl`/`.css`, a `Cargo.toml`, even a stray
  #    crate-level `notes.md` — flips it true and runs CI. Deliberately NOT
  #    excluded: `**/src/**/*.md`, because `latexml_contrib/src/script_bindings/
  #    API.md` is `#[doc = include_str!()]`-compiled and IS a rustdoc input.
  #  * macos — the native-libxml2/libxslt divergence surface (witness #292):
  #    `latexml_core/**` + `latexml_post/**` (where rust-libxml is used) plus the
  #    link/dep/config inputs. On a PR the macOS leg runs only when this matches;
  #    on a `main` push it runs for ANY code change (the net, see the macos job).
  #
  # This never SELECTS a test subset by path — that would hide regressions in a
  # coupled engine. It only skips WHOLE jobs when the diff cannot change their
  # outcome. The single required status check is `CI success` (bottom of file),
  # so a skipped job never blocks a PR.
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      not_docs: ${{ steps.filter.outputs.not_docs }}
      macos: ${{ steps.filter.outputs.macos }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # micromatch semantics: a file matches when it matches a positive
          # pattern and none of the `!` negations. `!*.md` is top-level only
          # (`*` does not cross `/`), so `.../src/**/API.md` stays code.
          filters: |
            not_docs:
              - '**'
              - '!*.md'
              - '!docs/**'
              - '!.github/**/*.md'
              - '!LICENSE'
            macos:
              - 'latexml_core/**'
              - 'latexml_post/**'
              - '**/build.rs'
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - '.config/nextest.toml'
              - '.github/workflows/CI.yml'

  # Quality gate, running the SAME script as the local pre-push hook
  # (tools/lint.sh — see the comment on the gate step below). No TeX Live: the
  # engine compiles without on-disk dumps (self-contained / embedded-fallback
  # invariant), so clippy only needs the C library headers, not a texmf tree.
  # Runs in parallel with `test`.
  #
  # The gate deliberately does NOT stop at the first failed check: it reports
  # every failure in one run. Fail-fast costs a whole CI cycle per failure when
  # several checks are broken at once, which is worse than the few extra
  # minutes. (tools/lint.sh --fail-fast restores the old behaviour.)
  #
  # `name:` is load-bearing — it is the check name branch protection matches.
  # Don't rename it casually, even though the gate now covers more than three
  # tools.
  lint:
    name: lint (fmt + clippy + deny)
    needs: changes
    # A docs-only diff changes no `.rs`, so clippy/rustdoc/deny cannot differ.
    if: needs.changes.outputs.not_docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
      RUST_BACKTRACE: "1"
    steps:
      - name: install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxml2-dev libxml2-utils libxslt1-dev libkpathsea-dev libkpathsea6 mold
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: lint
      # cargo-machete is installed BEFORE the gate below, which runs it.
      - name: install cargo-machete
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete

      # The gate itself: xml:id ratchet, rustfmt, clippy, rustdoc, the
      # vendored-native audit and cargo-machete. It lives in tools/lint.sh
      # because .githooks/pre-push runs the SAME script — one source of truth,
      # so the hook and CI cannot drift. (They were hand-maintained copies and
      # did drift: neither was a superset of the other, so a push could pass the
      # hook and still fail here on a check the hook never ran.) The per-check
      # rationale lives in that script, next to each check.
      #
      # LINT_PROFILE=ci keeps the RAM-tuned profile for this 16 GB runner;
      # LINT_STRICT=1 makes a missing tool an error here rather than the loud
      # skip a local run is allowed to take.
      - name: lint gate (tools/lint.sh — same script as .githooks/pre-push)
        env:
          LINT_PROFILE: ci
          LINT_STRICT: "1"
        run: tools/lint.sh

      - name: cargo-deny (advisories + licenses + bans + sources)
        # The action's default arguments inject `--all-features`, so this audits
        # feature-gated trees too (e.g. the off-by-default `cortex` worker deps).
        # Reproduce locally with: cargo deny --all-features check
        #
        # PINNED to v2.0.20 (2026-05-28): the floating `@v2` tag was re-tagged
        # 2026-07-13 to v2.1.0/v2.1.1, which bundle cargo-deny 0.20.2 and inject
        # a global `--log-level warn` that 0.20.2 no longer accepts (the flag was
        # removed) — so every run failed with `unrecognized subcommand 'warn'`.
        # Not a policy violation and not repo-specific: it broke main too on its
        # next run. Revisit/unpin once the action ships a fix.
        uses: EmbarkStudios/cargo-deny-action@v2.0.20
        with:
          command: check
        # Stays a separate step, and stays CI's real gate for licenses: it is a
        # Docker action, so tools/lint.sh cannot invoke it. That script runs
        # `cargo deny` only when the binary happens to be installed locally, as
        # a pre-push convenience — it is not a substitute for this step.

  # Miri (UB detector) over the FFI-FREE pure-Rust `unsafe` — the string
  # interner / arena bounds-skip (resolve_unchecked) + re-entrant `&mut *ptr`
  # sites (docs/release/SAFETY.md categories B/C), the only `unsafe` here with genuine
  # UB potential that Miri can execute. The FFI-bearing unsafe (libc / kpathsea
  # / libxml2 / libxslt dlsym / getrusage / signal) CANNOT run under Miri, so
  # coverage is deliberately scoped via tools/miri_check.sh. Build scripts
  # (libxml/kpathsea/marpa) still compile C natively, hence the dev headers.
  miri:
    name: miri (pure-Rust UB check)
    needs: changes
    if: needs.changes.outputs.not_docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      RUST_BACKTRACE: "1"
    steps:
      - name: install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxml2-dev libxml2-utils libxslt1-dev libkpathsea-dev libkpathsea6
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: miri
      - name: miri (scoped arena UB check)
        run: tools/miri_check.sh

  # AddressSanitizer lane — the deterministic net for heap memory-safety bugs
  # (use-after-free, double-free, out-of-bounds) that neither the plain Linux
  # suite nor miri catches. glibc TOLERATES a use-after-free that Darwin's
  # allocator aborts on (issue #703: a math-parser discard freed a libxml node
  # then read it — green on Linux, SIGABRT on the reporter's Mac), so a green
  # Linux suite is NOT proof of memory safety; and miri cannot cross the
  # libmarpa/libxml2 C FFI. ASAN intercepts the system allocator, so it catches
  # heap errors inside those C libraries too. Scoped to the math-parser
  # discard/free class (`06_cluster_math`, which carries the #703 guard) to stay
  # a single fast job — widen the nextest selection as new witnesses land.
  asan:
    name: asan (memory-safety UB check)
    needs: changes
    if: needs.changes.outputs.not_docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      RUST_BACKTRACE: "1"
    steps:
      - name: install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxml2-dev libxml2-utils libxslt1-dev libkpathsea-dev libkpathsea6 \
            texlive texlive-latex-extra texlive-science mold
          # `mold` is REQUIRED even though the ASAN test step drops it: the
          # `make formats` build below inherits `.cargo/config.toml`'s
          # `-C link-arg=-fuse-ld=mold` (gated to x86_64-linux), and it runs only
          # on a COLD dump cache — i.e. exactly when a PR touches the engine. With
          # mold absent, collect2 could find neither `ld.mold` nor `ld` and every
          # such PR failed here with `cannot find 'ld'`. The other Linux jobs
          # already install it; the asan job had been the lone omission.
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: asan
      # Same dump cache as the Linux `test` job (identical key): the dumps are
      # TL-derived text, independent of the ASAN instrumentation, so the two
      # jobs share one entry and this step is a no-op on the common cache hit.
      - name: TeX Live fingerprint (dump cache key)
        id: tlfp
        run: echo "year=$(pdflatex --version 2>/dev/null | sed -n 's:.*TeX Live \([0-9]\{4\}\).*:\1:p' | head -1)" >> "$GITHUB_OUTPUT"
      - name: cache engine dumps
        id: dumps
        uses: actions/cache@v4
        with:
          path: resources/dumps
          key: dumps-v1-${{ runner.os }}-tl${{ steps.tlfp.outputs.year }}-${{ hashFiles('latexml_core/src/**', 'latexml_engine/src/**', 'latexml_codegen/src/**') }}
      - name: make formats
        if: steps.dumps.outputs.cache-hit != 'true'
        env:
          PROFILE: ci
        run: tools/make_formats.sh
      - name: install cargo-nextest
        uses: taiki-e/install-action@nextest
      # `06_cluster_math` exercises the math-parser discard/free paths (the
      # #703 use-after-free lived there). Under ASAN this run is red on any
      # platform when a node is freed twice — the deterministic catch the plain
      # suite lacks. The sanitizer flags are scoped to THIS step (not the job
      # env) and paired with an explicit `--target`: that is exactly what makes
      # cargo build the proc-macros / build-scripts for the host WITHOUT the
      # sanitizer, so they still load — a job-wide RUSTFLAGS instruments them and
      # rustc then can't load them (E0463), and it would also contaminate the
      # `make formats` build above. Setting RUSTFLAGS overrides config.toml's
      # target rustflags, so the parallel-frontend flags are re-added; mold is
      # dropped (the default linker links the sanitizer runtime fine). LSAN off
      # (detect_leaks=0): the engine leaks thread-local / arena state by design;
      # halt_on_error stays default 1, so a UAF / double-free / OOB fails the job.
      # `--cargo-profile ci` = fast build; `--profile ci` = nextest profile.
      - name: run memory-safety tests under ASAN
        env:
          RUSTFLAGS: "-Zsanitizer=address -Zthreads=8 -Zunstable-options"
          ASAN_OPTIONS: "detect_leaks=0"
        run: cargo nextest run --cargo-profile ci --profile ci --target x86_64-unknown-linux-gnu -p latexml --test 06_cluster_math

  test:
    # Sharded across 4 runners. The suite's cost is ~398 s of in-binary
    # execution spread over the test targets (consolidated 2026-08 into fewer,
    # concern-grouped `cluster_*` binaries), and `cargo test` runs those
    # targets SEQUENTIALLY — so the test step was 18.7 min on Linux / 29.4 min
    # on macOS while compilation (warm rust-cache) was only 2.2 / 4.7 min.
    # Splitting the test list across runners is the fix that does NOT raise
    # per-runner memory: each shard still runs 2 tests at a time inside its own
    # 16 GB (see `test-threads` in .config/nextest.toml). `--partition` is
    # exact — measured 524 + 462 + 433 + 416 = 1835, the whole suite.
    name: latexml-oxide CI (shard ${{ matrix.shard }}/4)
    needs: changes
    # Full Linux suite on every code change (PR and main push); skipped only
    # for a docs-only diff.
    if: needs.changes.outputs.not_docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      # One shard's failure must not cancel the others: we want the FULL
      # failure picture from a red run, the same reason the local command
      # carries --no-fail-fast.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      # Runner: ubuntu-latest = 4 vCPU / 16 GB RAM / ~14 GB disk.
      #
      # All build settings live on the dedicated `ci` profile in the
      # workspace `Cargo.toml` (`[profile.ci]` + per-package overrides
      # for `latexml_contrib` / `latexml_package`). That profile is
      # version-controlled and reviewable; previously the same knobs
      # lived as `CARGO_PROFILE_RELEASE_*` env-vars here, which had the
      # side-effect of contaminating the `release` profile used for
      # distribution. Use `--profile ci` from every cargo invocation.
      #
      # Other knobs:
      #  * CARGO_BUILD_JOBS=2 — two rustc workers fit comfortably in
      #    16 GB once the per-package codegen-units split (above) lands.
      #    The previous OOM-kills (runs 25051556164 / 25055232786) came
      #    from `latexml_contrib` codegen at jobs=2 with the default
      #    codegen-units; the profile fix addresses that directly.
      #  * mold linker — ~2-4× faster than ld and streams symbols
      #    rather than slurping into RAM.
      #  * test concurrency of 2 — pgf/tikz cells can spike to GB-scale
      #    working sets; conservative parallelism leaves headroom.
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
      RUST_BACKTRACE: "1"
    steps:
      # Minimal apt set: only what `make formats` + tests actually need.
      # Removed: imagemagick, inkscape (graphics post-processing —
      # not exercised by the test suite); texlive-lang-* (only en/de/fr/
      # ru/el needed by tests, and texlive-lang-european is the heaviest
      # superset). Net: ~1.5 GB less apt download + install time.
      - name: install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxml2-dev libxml2-utils libxslt1-dev libkpathsea-dev libkpathsea6 \
            mold \
            texlive texlive-latex-extra texlive-science \
            texlive-bibtex-extra texlive-publishers \
            texlive-lang-german texlive-lang-french texlive-lang-greek \
            texlive-lang-cyrillic
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      # Cheap source-level ratchet: ban NEW string-keyed xml: attribute
      # accessors (the libxml namespaced-attribute footgun). Runs before the
      # expensive build so it fails fast. See docs/XMLID_ACCESSOR_AUDIT_2026-06-08.md.
      - name: lint (xml:id accessor footgun)
        run: tools/lint_xmlid_accessor.sh
      # NOTE: CI intentionally does NOT enable the `cortex` feature.
      # Cortex worker is a production deployment artifact, built separately.
      #
      # All cargo steps below run under the dedicated `ci` profile,
      # which has per-package codegen-units splits to keep peak RSS
      # under 16 GB even on the heaviest binding crates.
      # The engine dumps capture kernel state from `--init=plain.tex` /
      # `--init=latex.ltx` — the core + engine layers only. latexml_package is
      # loaded per-document via \usepackage, NOT during init, so package bindings
      # are NOT in the base dump and are deliberately EXCLUDED from the key —
      # otherwise the common case (editing a package binding) would needlessly
      # bust the cache. The dump is thus a deterministic function of
      # latexml_{core,engine,codegen}/src + the TeX Live release, so most PRs
      # (post, math-parser, PACKAGE bindings, tests, docs) skip the ~8-min
      # dump-generation step. Conservative within that set (over-regenerate,
      # never stale; the test suite catches a bad dump). `runner.os` keeps
      # Linux/macOS caches distinct. Bump `v1` if the dump format changes.
      - name: TeX Live fingerprint (dump cache key)
        id: tlfp
        run: echo "year=$(pdflatex --version 2>/dev/null | sed -n 's:.*TeX Live \([0-9]\{4\}\).*:\1:p' | head -1)" >> "$GITHUB_OUTPUT"
      - name: cache engine dumps
        id: dumps
        uses: actions/cache@v4
        with:
          path: resources/dumps
          key: dumps-v1-${{ runner.os }}-tl${{ steps.tlfp.outputs.year }}-${{ hashFiles('latexml_core/src/**', 'latexml_engine/src/**', 'latexml_codegen/src/**') }}
      - name: make formats
        if: steps.dumps.outputs.cache-hit != 'true'
        env:
          PROFILE: ci
        run: tools/make_formats.sh

      # Build test binaries first (--no-run) so the rustc/linker RSS peak
      # completes and is reclaimed before we spin up test workers. On a
      # warm rust-cache hit this is a no-op; on a cold cache it's the main
      # memory-pressure phase and isolating it from the test phase is
      # what fits the job back inside the 16 GB runner budget.
      - name: install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: build test binaries
        run: cargo nextest run --cargo-profile ci --profile ci --workspace --no-run

      - name: run tests
        # `--cargo-profile ci` selects the Cargo profile; `--profile ci`
        # selects the NEXTEST profile (.config/nextest.toml). They are
        # different knobs that happen to share a name.
        run: cargo nextest run --cargo-profile ci --profile ci --workspace --partition count:${{ matrix.shard }}/4

  # macOS mirror of the Linux job above (issue #217). Same `ci` profile,
  # same make-formats → build → run flow; only the platform deps differ:
  # Homebrew instead of apt, and NO mold (the .cargo/config.toml
  # `-fuse-ld=mold` rustflags are gated to x86_64-linux, so the
  # aarch64-darwin link uses the system linker — we simply don't set the
  # mold RUSTFLAGS here). Uses Homebrew's `texlive`, which ships
  # libkpathsea + kpathsea.pc, so the in-process linked kpathsea backend is
  # exercised end-to-end. (MacTeX/BasicTeX's subprocess-`kpsewhich` fallback
  # is documented in README.md but not gated here — it lacks the package set
  # the full suite needs.)
  macos:
    name: latexml-oxide CI (macOS shard ${{ matrix.shard }}/4)
    needs: changes
    # macOS is the slow leg and its unique value is the native libxml2/libxslt
    # divergence surface (#292). On a PR run it only when that surface changed
    # (`changes.macos`); on a `main` push run it for ANY code change — that
    # post-merge run is the net that catches a macOS regression a PR's narrow
    # filter let through. Docs-only diffs skip it on both.
    if: >-
      needs.changes.outputs.not_docs == 'true' &&
      (needs.changes.outputs.macos == 'true' || github.event_name == 'push')
    runs-on: macos-15
    # 3 vCPU / 7 GB RAM — tighter than the 16 GB Linux runner, so the same
    # RAM-tuned `ci` profile + jobs=2 apply; the cold build dominates, so
    # allow more wall-clock than the Linux leg.
    timeout-minutes: 120
    # Sharded like the Linux leg, and this is where it pays most: macOS was the
    # gating job at ~47 min, of which 29.4 min was the sequential test step.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      RUST_BACKTRACE: "1"
    steps:
      # libxml2 + libxslt are keg-only on Homebrew; install them and surface
      # their pkgconfig dirs so the libxml/libxslt build scripts find them.
      - name: install dependencies
        run: |
          command -v pkg-config >/dev/null || brew install pkgconf
          brew install libxml2 libxslt texlive
      - name: surface keg-only pkg-config paths
        run: |
          echo "PKG_CONFIG_PATH=$(brew --prefix libxml2)/lib/pkgconfig:$(brew --prefix libxslt)/lib/pkgconfig" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: macos
      # The engine dumps capture kernel state from `--init=plain.tex` /
      # `--init=latex.ltx` — the core + engine layers only. latexml_package is
      # loaded per-document via \usepackage, NOT during init, so package bindings
      # are NOT in the base dump and are deliberately EXCLUDED from the key —
      # otherwise the common case (editing a package binding) would needlessly
      # bust the cache. The dump is thus a deterministic function of
      # latexml_{core,engine,codegen}/src + the TeX Live release, so most PRs
      # (post, math-parser, PACKAGE bindings, tests, docs) skip the ~8-min
      # dump-generation step. Conservative within that set (over-regenerate,
      # never stale; the test suite catches a bad dump). `runner.os` keeps
      # Linux/macOS caches distinct. Bump `v1` if the dump format changes.
      - name: TeX Live fingerprint (dump cache key)
        id: tlfp
        run: echo "year=$(pdflatex --version 2>/dev/null | sed -n 's:.*TeX Live \([0-9]\{4\}\).*:\1:p' | head -1)" >> "$GITHUB_OUTPUT"
      - name: cache engine dumps
        id: dumps
        uses: actions/cache@v4
        with:
          path: resources/dumps
          key: dumps-v1-${{ runner.os }}-tl${{ steps.tlfp.outputs.year }}-${{ hashFiles('latexml_core/src/**', 'latexml_engine/src/**', 'latexml_codegen/src/**') }}
      - name: make formats
        if: steps.dumps.outputs.cache-hit != 'true'
        env:
          PROFILE: ci
        run: tools/make_formats.sh
      - name: install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: build test binaries
        run: cargo nextest run --cargo-profile ci --profile ci --workspace --no-run
      - name: run tests
        # `--cargo-profile ci` selects the Cargo profile; `--profile ci`
        # selects the NEXTEST profile (.config/nextest.toml). They are
        # different knobs that happen to share a name.
        run: cargo nextest run --cargo-profile ci --profile ci --workspace --partition count:${{ matrix.shard }}/4

  # Single aggregating gate. Branch protection matches required checks BY NAME,
  # and a skipped matrix check (`shard 1/4`, `macOS shard 2/4`, …) leaves a PR
  # "waiting for status" forever — so the individual jobs above CANNOT be the
  # required checks once they became conditional. Make THIS the sole required
  # check instead (plus the external GitGuardian one). It always runs (the
  # workflow always triggers; `if: always()`), and passes iff every upstream
  # job either succeeded or was legitimately skipped — a real failure or
  # cancellation fails it. Repointing branch protection to `CI success` is a
  # repo-settings change that must land WITH this workflow.
  ci-success:
    name: CI success
    needs: [changes, lint, miri, asan, test, macos]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: verify no required job failed
        run: |
          results='${{ needs.changes.result }} ${{ needs.lint.result }} ${{ needs.miri.result }} ${{ needs.asan.result }} ${{ needs.test.result }} ${{ needs.macos.result }}'
          echo "upstream job results: $results"
          for r in $results; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::a required job did not pass (result: $r)"; exit 1 ;;
            esac
          done
          echo "all required jobs passed or were legitimately skipped"
