# Windows CI (manual trigger) — build + full test suite on windows-latest.
# Tracks docs/release/WINDOWS_COMPATIBILITY_PLAN.md. (The RELEASE artifact —
# the single .exe — is built by release.yml's build-windows leg, which reuses
# this file's vcpkg/static recipe.)
#
# NOT part of required CI yet (Phase 4 promotes this into CI.yml once the
# job is stably green).
#
# THREE jobs, three triggers:
#
#   `build` + `test` — the full suite: MANUAL (`workflow_dispatch`), and called
#             by release.yml (`workflow_call`) before anything is published.
#             It installs TeX Live and runs every test, so it stays deliberate.
#             `build` compiles once into a nextest archive; the `test` shards
#             run from it. The suite runs in two parts (DG 2026-11-13). `required` (every
#             test but the `perfect_kernel_*` guards, 3 shards) must pass. The
#             `perfect_kernel_*` guards (8 shards) run in full, but a
#             dispatch run is green with them failing (`continue-on-error`).
#             A release calls with `require_guards: true`: there every guard
#             must pass, so no broken Windows build is published.
#   `check` — a COMPILE ONLY (`cargo check`), fired automatically when a file
#             carrying `#[cfg(windows)]` code changes, plus weekly.
#
# Why `check` exists: 0.7.5-rc4's release failed its Windows leg on a symbol
# that windows-sys had renamed. That line had NEVER compiled — CI builds
# Linux and macOS only, so the RELEASE workflow, running on a tag, was its
# first Windows compile, three days after it landed. A path-triggered compile
# catches that class in the PR that introduces it. A commit-message convention
# was considered and rejected: it depends on remembering it, exactly when
# attention is elsewhere.
#
# The weekly `schedule` covers what paths structurally cannot — a dependency
# renaming a symbol with no file of ours changing.
#
# On cost: an earlier version of this comment said the repo "meters Windows
# Actions minutes at 2×". That was true when it was PRIVATE. The repository is
# public, and GitHub bills nothing for standard runners on public repos
# (larger runners are still charged, which is why this uses `windows-latest`).
# The real budget here is queue time and the 20-concurrent-job cap, not money.
#
# (Historical note: the old `Repository access blocked` failures were GitHub
# failing to fetch the dead `teatimeguest/setup-texlive-action`, whose account
# went 404 — fixed by moving to the TeX-Live org, not an access problem.)
#
# Mirrors CI.yml's macOS flow (deps → dumps → build once → test shards) with the
# Windows specifics learned during local bring-up (2026-07-12):
#   * vcpkg static libxml2/libxslt, triplet x64-windows-static-md
#   * TeX Live via setup-texlive-action (collections mirror the apt list)
#   * dump generation via tools/make_formats.ps1 (no bash)
#   * `ci` profile (no LTO — release-profile LTO costs ~2 min per test exe)
on:
  workflow_dispatch:
    inputs:
      require_guards:
        description: 'Fail the run when a perfect_kernel_* guard fails'
        type: boolean
        default: false
  workflow_call:
    inputs:
      require_guards:
        type: boolean
        default: true
  pull_request:
    # Every file that carries `#[cfg(windows)]`/`windows_sys` code, plus the
    # manifests that pin the Windows crates. Keep this list in step with
    #   grep -rl 'cfg(windows)\|windows_sys' --include=*.rs .
    paths:
      - 'latexml_core/src/watchdog.rs'
      - 'latexml_core/src/util/pathname.rs'
      - 'latexml_post/src/xslt.rs'
      - 'latexml_post/src/graphics.rs'
      - 'latexml_oxide/src/util/test.rs'
      - '**/Cargo.toml'
      - '.github/workflows/windows-ci-manual-trigger.yml'
  schedule:
    # Mondays 04:00 UTC — catches a dependency renaming a symbol when no file
    # of ours changed, which no path filter can see.
    - cron: '0 4 * * 1'

name: Windows CI

# Not `github.workflow`: called from release.yml that names the CALLER, and a
# group shared with the caller would cancel or deadlock it.
concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

# The TeX Live year this workflow tests: a released, supported year, moved only by a deliberate edit
# (CI.yml's year policy). Without `version` the action installs tlnet's latest, a year the suite may
# not support yet. No package manager ships a prebuilt TeX Live for Windows, so this is still
# `install-tl` package by package (~1 h) whenever the action's cache is cold: the key is the year +
# the package list, and an entry unread for 7 days is evicted. 2026 is the year (and key) the cache
# already holds. The lasting fix is a prebuilt snapshot per year: WINDOWS_COMPATIBILITY_PLAN.md,
# "Fast TeX-ecosystem CI install".
env:
  TEXLIVE_VERSION: "2026"

jobs:
  # ONE build for all 11 test shards (#916's macOS design). Each shard used to
  # pay the whole fixed cost for itself: vcpkg 4-7 min (its cache is evicted
  # from the over-full repo cache, so libiconv/zlib/libxml2/libxslt build from
  # source), make formats 5-7 min on a dump-cache miss (all 11 regenerate at
  # once), and the build 7-13 min, against 4-8 min of tests. Run 44383838311
  # (2026-11-18): 328 runner-minutes, ~60 of them testing. Now the build job
  # pays that once and uploads a nextest archive + the dumps; the shards only
  # restore TeX Live (cached) and run their part from the archive.
  build:
    # Full suite stays deliberate: a dispatch, or a release's call. Under a
    # call `github.event_name` is the caller's (`push` of a tag), so the
    # call is told apart by its input, which other triggers do not set.
    # The test shards below run exactly when this job succeeds.
    if: github.event_name == 'workflow_dispatch' || inputs.require_guards
    name: build (x86_64-pc-windows-msvc)
    runs-on: windows-latest
    # Covers a COLD TeX Live install (see CI.yml macos-build): this workflow
    # runs only on a dispatch or a release, so its TeX Live cache is often
    # older than the 7 days GitHub keeps an unread entry.
    timeout-minutes: 150
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      RUST_BACKTRACE: "1"
      # Static C libraries + dynamic CRT (see plan Phase 1.1).
      VCPKG_TRIPLET: x64-windows-static-md
      VCPKGRS_TRIPLET: x64-windows-static-md
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
      # Only `main` saves (CI.yml's lint job explains the cache budget).
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: windows-ci-manual
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cache vcpkg installed tree
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_INSTALLATION_ROOT }}\installed
          key: vcpkg-${{ env.VCPKG_TRIPLET }}-libxml2-libxslt-v1
      - name: vcpkg install libxml2 + libxslt (static)
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg" install `
            "libxml2:$env:VCPKG_TRIPLET" "libxslt:$env:VCPKG_TRIPLET"
      - name: export vcpkg root
        run: '"VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV'

      # Collections mirror the ubuntu job's apt list (texlive, latex-extra,
      # science, bibtex-extra, publishers, lang de/fr/el/ru) — see plan
      # Phase 4.1. dvipng is NOT in any of these collections (local finding).
      - name: install TeX Live
        # `teatimeguest/setup-texlive-action` was the original home; that whole
        # account is now 404, which made GitHub abort the job at "Getting action
        # download info" with `Repository access blocked`. The action moved to
        # the TeX-Live org — same inputs (`packages`/`cache`).
        uses: TeX-Live/setup-texlive-action@v4
        with:
          version: ${{ env.TEXLIVE_VERSION }}
          packages: >-
            scheme-medium
            collection-latexextra
            collection-mathscience
            collection-bibtexextra
            collection-publishers
            collection-fontsextra
            collection-langgerman
            collection-langfrench
            collection-langgreek
            collection-langcyrillic
            dvipng

      - name: TeX Live fingerprint (dump cache key)
        id: tlfp
        shell: bash
        run: bash tools/ci_tex_fingerprint.sh
      - name: cache engine dumps
        id: dumps
        uses: actions/cache@v4
        with:
          path: resources/dumps
          key: dumps-v1-${{ runner.os }}-tl${{ steps.tlfp.outputs.year }}-${{ steps.tlfp.outputs.sources }}-${{ hashFiles('latexml_core/src/**', 'latexml_engine/src/**', 'latexml_codegen/src/**', 'latexml_oxide/src/ini_tex.rs') }}
      - name: make formats
        if: steps.dumps.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          PROFILE: ci
        run: tools/make_formats.ps1

      - name: install cargo-nextest
        uses: taiki-e/install-action@nextest
      # One compile for every shard: the archive holds every test binary, the
      # workspace binaries the tests spawn and the build-script outputs.
      # libxml2/libxslt are linked statically (the triplet), and the
      # kpathsea DLL comes from TeX Live's bin dir, which every shard has.
      - name: archive test binaries
        run: cargo nextest archive --cargo-profile ci --workspace --archive-file nextest-windows.tar.zst
      - uses: actions/upload-artifact@v5
        with:
          name: windows-test-archive
          path: |
            nextest-windows.tar.zst
            resources/dumps
          retention-days: 1
          # The archive is already zstd; a re-run of this job replaces it.
          compression-level: 0
          overwrite: true
          if-no-files-found: error

  test:
    # Sharded under nextest like the Linux/macOS legs (CIP0, 2026-11-13): one
    # `cargo test` job projected >= 2 h of test alone against its 120-min
    # timeout.
    name: test (x86_64-pc-windows-msvc, ${{ matrix.part }} ${{ matrix.shard }}/${{ matrix.of }})
    needs: build
    runs-on: windows-latest
    timeout-minutes: 60
    # The guards' shards are optional to pass unless the caller requires them.
    continue-on-error: ${{ matrix.part == 'guards' && !inputs.require_guards }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { part: required, shard: 1, of: 3 }
          - { part: required, shard: 2, of: 3 }
          - { part: required, shard: 3, of: 3 }
          - { part: guards, shard: 1, of: 8 }
          - { part: guards, shard: 2, of: 8 }
          - { part: guards, shard: 3, of: 8 }
          - { part: guards, shard: 4, of: 8 }
          - { part: guards, shard: 5, of: 8 }
          - { part: guards, shard: 6, of: 8 }
          - { part: guards, shard: 7, of: 8 }
          - { part: guards, shard: 8, of: 8 }
    env:
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v6
      # The same package set as the build job, so this restores the cache that
      # job used: the tree its dumps were stamped against.
      # Collections mirror the ubuntu job's apt list (texlive, latex-extra,
      # science, bibtex-extra, publishers, lang de/fr/el/ru) — see plan
      # Phase 4.1. dvipng is NOT in any of these collections (local finding).
      - name: install TeX Live
        # `teatimeguest/setup-texlive-action` was the original home; that whole
        # account is now 404, which made GitHub abort the job at "Getting action
        # download info" with `Repository access blocked`. The action moved to
        # the TeX-Live org — same inputs (`packages`/`cache`).
        uses: TeX-Live/setup-texlive-action@v4
        with:
          version: ${{ env.TEXLIVE_VERSION }}
          packages: >-
            scheme-medium
            collection-latexextra
            collection-mathscience
            collection-bibtexextra
            collection-publishers
            collection-fontsextra
            collection-langgerman
            collection-langfrench
            collection-langgreek
            collection-langcyrillic
            dvipng

      - uses: actions/download-artifact@v6
        with:
          name: windows-test-archive
          path: .
      - name: install cargo-nextest
        uses: taiki-e/install-action@nextest
      - name: run tests
        # The archive keeps the build's Cargo profile; it is extracted into the
        # workspace, so `target/` sits at the build job's absolute path, the one
        # each test's compile-time `env!("CARGO_BIN_EXE_...")` names. `--profile
        # ci` selects the NEXTEST profile. `hash:` assigns each test by its own
        # name, so a filter and a partition compose: every guard lands in
        # exactly one guards shard.
        env:
          LATEXML_TEST_SKIP_LOG: ${{ github.workspace }}/target/test-skips.log
          # Only runs prebuilt binaries: the runner's stable cargo suffices, and
          # it keeps rustup from fetching rust-toolchain.toml's nightly (plus
          # rustfmt/clippy/rust-src) in every shard. No test spawns cargo/rustc.
          RUSTUP_TOOLCHAIN: stable
        run: >-
          cargo nextest run --archive-file nextest-windows.tar.zst
          --extract-to "${{ github.workspace }}" --extract-overwrite
          --workspace-remap "${{ github.workspace }}"
          --profile ci
          -E '${{ matrix.part == 'guards' && 'test(/^perfect_kernel_/)' || 'not test(/^perfect_kernel_/)' }}'
          --partition hash:${{ matrix.shard }}/${{ matrix.of }}

      - name: skipped tests (requirements not met)
        # `check_requirements` skips (Perl's check_requirements); no log = none skipped.
        if: always()
        shell: bash
        run: bash tools/test_skip_summary.sh

  # COMPILE ONLY. No TeX Live, no dumps, no tests — just enough to prove the
  # Windows arms still typecheck against the crates we pin. This is the job
  # that would have caught 0.7.5-rc4's `GLOBAL_MEMORY_STATUS_EX` in its PR.
  check:
    if: github.event_name == 'pull_request' || github.event_name == 'schedule'
    name: cargo check (x86_64-pc-windows-msvc)
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      RUST_BACKTRACE: "1"
      VCPKG_TRIPLET: x64-windows-static-md
      VCPKGRS_TRIPLET: x64-windows-static-md
      # This job is COMPILE ONLY on a TeX-less runner, which is precisely the
      # case kpathsea's build-script toolchain check exists to catch at
      # runtime-deployment time — and precisely its documented bypass:
      # "Building on a machine without TeX for deployment to one with it?"
      # Without this, the job dies in kpathsea's build script ("no usable TeX
      # backend") before checking anything — it has NEVER been green.
      # The `build + test` job installs TeX Live and keeps the check armed.
      KPATHSEA_SKIP_TOOLCHAIN_CHECK: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
      # Only `main` saves (CI.yml's lint job explains the cache budget).
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: windows-check
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cache vcpkg installed tree
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_INSTALLATION_ROOT }}\installed
          key: vcpkg-${{ env.VCPKG_TRIPLET }}-libxml2-libxslt-v1
      - name: vcpkg install libxml2 + libxslt (static)
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg" install `
            "libxml2:$env:VCPKG_TRIPLET" "libxslt:$env:VCPKG_TRIPLET"
      - name: export vcpkg root
        run: '"VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV'
      # `--all-targets` so tests and benches are typechecked too: they carry
      # their own `#[cfg(windows)]` arms (util/test.rs among them).
      - name: cargo check
        run: cargo check --workspace --all-targets --profile ci
